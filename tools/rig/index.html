<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Character animation merger</title>
  <style>
    body { margin: 0; background: #16181d; color: #e8eaee; font: 14px/1.5 system-ui, sans-serif; display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
    aside { padding: 16px; display: grid; gap: 10px; align-content: start; overflow: auto; background: #1d2027; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    button { font: inherit; padding: 8px 10px; border: 0; background: #2b303a; color: inherit; cursor: pointer; text-align: left; }
    button[aria-pressed="true"] { background: #3d6fb5; }
    button:focus-visible { outline: 2px solid #8fcaff; }
    #save { background: #2e6b45; }
    #log { white-space: pre-wrap; font-size: 12px; color: #aab1bd; }
    canvas { width: 100%; height: 100vh; display: block; }
  </style>
</head>
<body>
  <aside>
    <h1>Animation merger</h1>
    <p>Loads the Mixamo FBX files onto the skinned character, applies the original texture, previews each clip and saves one GLB.</p>
    <div id="clips" role="group" aria-label="Preview a clip"></div>
    <button id="save" disabled>Save merged GLB</button>
    <div id="log" aria-live="polite"></div>
  </aside>
  <main id="view"></main>
  <script type="module" src="./merge.js"></script>
</body>
</html>
