<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Adventures of Bunny · Bhavay Aggarwal</title>
  <meta name="description" content="The Adventures of Bunny: Bhavay Aggarwal's journey through code, curiosity, and the soundtrack that carried it all." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230c0a08'/><text x='16' y='23' font-family='sans-serif' font-size='19' fill='%23c9a45a' text-anchor='middle'>B</text></svg>" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500&display=swap" rel="stylesheet" />
</head>
<body data-root="../" class="is-story">
  <main id="main">
    <div class="wrap story-body">
      <!-- The stage: set pieces behind and in front, the 3D character (src/figure.js) between them -->
      <figure class="story-stage figure-slot" id="figure-slot" tabindex="0" role="img" aria-label="Bunny, Bhavay's 3D character, acting out the current track. Click him or press Enter and he waves back.">
        <div class="set back" id="set-back" aria-hidden="true"></div>
        <div class="set front" id="set-front" aria-hidden="true"></div>
        <span class="figure-hint" id="stage-hint">Click Bunny to say hi</span>
        <span class="figure-fallback"><img src="../stills/wave.webp" width="1200" height="1500" alt="" loading="lazy" /></span>
      </figure>
      <div class="story-col">
        <header class="story-head">
          <h1 id="album"></h1>
          <p class="lede" id="subtitle"></p>
        </header>
        <ol class="tracks" id="tracks"></ol>
        <section class="debrief" id="debrief">
          <h2 id="ending-title"></h2>
          <p class="lede" id="ending-text"></p>
          <div class="cta-row" id="ending-links"></div>
        </section>
      </div>
    </div>
  </main>
  <div class="player" id="player" role="region" aria-label="Story player">
    <button class="vinyl" id="vinyl" aria-label="Spin the record">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle class="ring-bg" cx="24" cy="24" r="22" />
        <circle class="ring" id="ring" cx="24" cy="24" r="22" pathLength="100" />
      </svg>
      <span class="label"></span>
    </button>
    <p class="now" id="now" aria-live="polite"></p>
    <div class="controls">
      <button class="icon-btn" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn play-btn" id="play" aria-label="Play the story"><svg class="i-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="next" aria-label="Next track"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <script type="module" src="/src/pages/story.js"></script>
</body>
</html>
