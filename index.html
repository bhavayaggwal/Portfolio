<head>
  <meta charset="utf-8" />

  <!--head-->
  <script>
    // Theme before first paint, so dark-mode visitors never see a white flash. Saved choice, else the system's.
    try { var s = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
