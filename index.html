<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bhavay Aggarwal</title>
  <meta name="description" content="Bhavay Aggarwal (Bunny): developer turned AI project manager. Play the story, or browse work, papers and skills." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231A1816'/><text x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%23F5F1EA' text-anchor='middle'>B</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-root="./" class="is-landing">
  <main id="main" class="landing">
    <div class="landing-copy">
      <h1 class="display" id="name"></h1>
      <p class="landing-tagline" id="tagline"></p>
      <p class="lede" id="landing-line"></p>
      <a class="btn primary play" id="play" href="story/"><span aria-hidden="true">▶</span> Play my story</a>
      <nav class="landing-links" id="landing-links" aria-label="More"></nav>
    </div>
    <!-- The 3D character (src/figure.js) is drawn over this slot -->
    <figure class="figure-slot" id="figure-slot" tabindex="0" role="img" aria-label="Interactive 3D figure of Bhavay. Click or press Enter to wave; drag or use arrow keys to turn.">
      <span class="figure-hint mono">Drag to turn · click to wave</span>
      <span class="figure-fallback display" aria-hidden="true">BA</span>
    </figure>
  </main>
  <script type="module" src="/src/pages/home.js"></script>
</body>
</html>
